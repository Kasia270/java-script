<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
</head>
<body>
<div style="color:blue;font-size:40px;">
<script>
let suma_was = 0;

for(let iwas = 1; iwas <= 1000000; iwas++)
{
    suma_was = suma_was + 1 / iwas;
}

document.write("Suma szeregu harmonicznego = " + suma_was);
</script>
</div>
</body>
</html>
