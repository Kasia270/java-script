<script>
let ile_razy_was = parseInt(prompt("Ile razy napisać?",""));
let tekst_was = prompt("Podaj inicjały:","KW");

for(let iwas = 1; iwas <= ile_razy_was; iwas++)
{
    for(let kwas = 1; kwas <= iwas; kwas++)
    {
        document.write("&nbsp;&nbsp;&nbsp;");
    }

    document.write(iwas + "_" + tekst_was + "_" + iwas + "<br>");
}
</script>
