<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
</head>
<body>
<script>

let a_was = parseInt(prompt("Podaj wysokość a=",""));
let b_was = parseInt(prompt("Podaj szerokość b=",""));

for(let iwas = 1; iwas <= b_was; iwas++)
{
    document.write("*");
}

document.write("<br>");

let wiersz_was = "*";

for(let iwas = 1; iwas <= (b_was - 2); iwas++)
{
    wiersz_was = wiersz_was + "&nbsp;&nbsp;";
}

wiersz_was = wiersz_was + "*";
for(let iwas = 1; iwas <= (a_was - 2); iwas++)
{
    document.write(wiersz_was + "<br>");
}

for(let iwas = 1; iwas <= b_was; iwas++)
{
    document.write("*");
}
</script>
</body>
</html>
