<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
</head>
<body>
<div style="color:green;font-size:40px;">
<script>
let n_was = parseInt(prompt("Podaj n=",""));
let silnia_was = 1;

if(n_was == 0)
{
    silnia_was = 1;
}
else
{
    for(let iwas = 1; iwas <= n_was; iwas++)
    {
        silnia_was = silnia_was * iwas;
    }
}

document.write(n_was + "! = " + silnia_was);
</script>
</div>
</body>
</html>
