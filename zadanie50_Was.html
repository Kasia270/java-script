<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">

</head>
<body>
<script>
document.write("<div style='color:red;font-size:2cm;'>Wasilewska</div>");
document.write("<div style='color:blue;font-size:5mm;'>Temat: Wyprowadzanie liczb od 1 do 10 przesuniętych o jedną spację w prawo.</div><br>");

for(let iwas = 1; iwas <= 10; iwas++)
{
    for(let kwas = 1; kwas <= iwas; kwas++)
    {
        document.write("&nbsp;&nbsp;");
    }

    document.write(iwas + "<br>");
}

</script>
</body>
</html>
